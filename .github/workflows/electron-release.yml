name: Electron Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without leading v (e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          VERSION="${VERSION#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Using version $VERSION"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set package.json version
        shell: bash
        run: |
          bun -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Resolve product name
        id: brand
        shell: bash
        run: |
          NAME=$(bun -e 'import { APP_CONFIG } from "./convex/appConfig.ts"; process.stdout.write(APP_CONFIG.name)')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Artifact prefix: $NAME"

      - name: Package Electron
        env:
          ELECTRON_PLATFORM: ${{ matrix.platform }}
          ELECTRON_ARCH: ${{ matrix.arch }}
          # Higher GitHub API rate limit when downloading convex-local-backend
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bun scripts/electron-pack.mjs

      - name: Upload installer and update metadata
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.platform }}
          # Installers + .blockmap (same ${name}-* prefix) + electron-updater feeds.
          # Do not also glob *.blockmap — that double-matches and races release upload.
          path: |
            release/${{ steps.brand.outputs.name }}-*
            release/latest*.yml
          if-no-files-found: error

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Resolve product name
        id: brand
        shell: bash
        run: |
          NAME=$(bun -e 'import { APP_CONFIG } from "./convex/appConfig.ts"; process.stdout.write(APP_CONFIG.name)')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      - name: Create GitHub Release
        # v3 runs on Node 24 and recovers transient asset-metadata 404s.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          # ${name}-* already includes installers and .blockmap files.
          files: |
            installers/${{ steps.brand.outputs.name }}-*
            installers/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep ./VERSION on the default branch in sync so Portainer/Docker builds that
  # lack git tags still stamp the latest released semver (no manual bump).
  sync-version:
    needs: [prepare, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump VERSION file
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          CURRENT="$(tr -d '[:space:]' < VERSION 2>/dev/null || true)"
          if [ "$CURRENT" = "$VERSION" ]; then
            echo "VERSION already ${VERSION}"
            exit 0
          fi
          printf '%s\n' "$VERSION" > VERSION
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump VERSION to ${VERSION}"
          git push
